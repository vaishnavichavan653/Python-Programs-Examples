<!DOCTYPE html>
<html>
<head>
    <title>User Login</title>
</head>
<body>
    <h2>User Login Form</h2>

    <form method="POST">
        {% csrf_token %}

        Username:
        <input type="text" name="username" required>
        <br><br>

        Password:
        <input type="password" name="password" required>
        <br><br>

        <button type="submit">Login</button>
    </form>

    <h3>{{ message }}</h3>
</body>
</html>
